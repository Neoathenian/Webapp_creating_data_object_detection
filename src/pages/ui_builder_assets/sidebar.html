<!-- Sidebar markup that lists APIs and provides creation controls. -->

<div id='sidebar'>
  <h3>Templates</h3>
  <div style='display:flex; gap:8px; flex-wrap:wrap;'>
    <button id='btn-new-api' class='btn primary'>+ New template</button>
    <button id='btn-evaluate-all' class='btn primary collector-control'>Evaluate all</button>
    <button id='btn-crop-bboxes' class='btn collector-control crop-bboxes-control'>Crop bboxes</button>
  </div>
  <ul id='api-list' class='sidebar-list'></ul>
</div>
